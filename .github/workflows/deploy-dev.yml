name: Deploy dev

on:
  workflow_dispatch: {}

permissions:
  id-token: write # required to mint the OIDC token for AWS
  contents: read

concurrency:
  # dev is one shared environment — a newer push (on this or another PR)
  # supersedes whatever's currently deployed there.
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install jinja2

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - run: npx sst deploy --stage dev
